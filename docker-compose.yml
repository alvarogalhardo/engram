services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: engram
      POSTGRES_PASSWORD: engram
      POSTGRES_DB: engram
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engram -d engram"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: ./server
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://engram:engram@postgres:5432/engram?sslmode=disable
      ENGRAM_API_TOKEN: ${ENGRAM_API_TOKEN:-dev-token-change-me}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
