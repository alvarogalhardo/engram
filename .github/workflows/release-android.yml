name: release-android

on:
  push:
    tags: ['android-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore keystore from secrets
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Unit tests + signed release APK
        working-directory: android
        env:
          ENGRAM_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ENGRAM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ENGRAM_KEY_ALIAS: engram
          ENGRAM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon test assembleRelease -PversionCode=${{ github.run_number }}

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk engram-${{ github.ref_name }}.apk

      - uses: softprops/action-gh-release@v2
        with:
          files: engram-${{ github.ref_name }}.apk
